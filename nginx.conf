# Domínio oficial = suljett.com. Qualquer outro host (ambiente de testes do
# Easypanel etc.) responde com noindex e robots.txt bloqueando tudo, para não
# concorrer com o site oficial nem gerar conteúdo duplicado no Google.
map $host $sj_noindex {
    default           "noindex, nofollow";
    suljett.com       "";
    www.suljett.com   "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # atrás do proxy do Easypanel: Location relativa, sem http:// nem porta

    if ($host = www.suljett.com) {
        return 301 https://suljett.com$request_uri;
    }
    # Home única em "/". $request_uri é o que o visitante pediu, então o
    # redirecionamento interno do `index` não entra em loop.
    if ($request_uri = /index.html) {
        return 301 /;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;

    # Header vazio não é enviado: no domínio oficial fica sem X-Robots-Tag.
    add_header X-Robots-Tag $sj_noindex always;

    location = /robots.txt {
        default_type text/plain;
        if ($sj_noindex) {
            return 200 "User-agent: *\nDisallow: /\n";
        }
    }


    location ~* \.(png|jpg|jpeg|webp|avif|gif|ico|svg|woff2|ttf|mp4|pdf)$ {
        expires 1y;
        add_header Cache-Control "public";
        add_header X-Robots-Tag $sj_noindex always;
    }

    # CSS/JS sem hash no nome: revalida a cada visita (ETag), nunca serve versão velha.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag $sj_noindex always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
