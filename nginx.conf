server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /wireframes/ — 404 explícito se o arquivo não existir
    # (evita que URLs inválidas sob /wireframes/ caiam no fallback da home
    # e quebrem links relativos do menu, virando /wireframes/wireframes/...)
    location /wireframes/ {
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
